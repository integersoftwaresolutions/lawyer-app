<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{subject}}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: #333333;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }
    .email-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
    }
    .email-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 40px 30px;
      text-align: center;
      border-radius: 10px 10px 0 0;
    }
    .email-header h1 {
      color: #ffffff;
      margin: 0;
      font-size: 24px;
      font-weight: 600;
    }
    .email-body {
      padding: 40px 30px;
      background-color: #ffffff;
    }
    .email-content {
      color: #333333;
      font-size: 16px;
      line-height: 1.8;
    }
    .email-footer {
      padding: 30px;
      background-color: #f9f9f9;
      border-top: 1px solid #e5e5e5;
      text-align: center;
      border-radius: 0 0 10px 10px;
    }
    .email-footer p {
      margin: 0;
      color: #999999;
      font-size: 12px;
    }
    .button {
      display: inline-block;
      padding: 14px 28px;
      background-color: #667eea;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      margin: 20px 0;
    }
    .code-box {
      background-color: #ffffff;
      border: 2px dashed #667eea;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      margin: 30px 0;
    }
    .code {
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 12px;
      color: #667eea;
      font-family: 'Courier New', monospace;
      margin: 0;
    }
    @media only screen and (max-width: 600px) {
      .email-body {
        padding: 30px 20px;
      }
      .email-header {
        padding: 30px 20px;
      }
      .code {
        font-size: 28px;
        letter-spacing: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="email-container">
    <div class="email-header">
      <h1>{{headerTitle}}</h1>
    </div>
    <div class="email-body">
      <div class="email-content">
        {{content}}
      </div>
    </div>
    <div class="email-footer">
      <p>&copy; {{year}} {{appName}}. All rights reserved.</p>
      <p style="margin-top: 8px; font-size: 11px; color: #cccccc;">
        This is an automated email. Please do not reply to this message.
      </p>
    </div>
  </div>
</body>
</html>
