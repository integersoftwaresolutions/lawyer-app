<h2>Planner reminder</h2>
<p>Hi{{recipientName}},</p>
<p>Your event <strong>{{eventTitle}}</strong> starts in <strong>{{reminderLabel}}</strong>.</p>
<div class="info-card">
  <p><span class="info-label">When:</span> {{scheduledAt}}</p>
  <p><span class="info-label">Type:</span> {{eventType}}</p>
  {{locationBlock}}
</div>
<div class="cta-wrap">
  <a class="cta" href="{{plannerUrl}}">Open Planner</a>
</div>
