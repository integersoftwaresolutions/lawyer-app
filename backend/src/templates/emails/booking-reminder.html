<h2>Upcoming consultation reminder</h2>
<p>Hi{{recipientName}},</p>
<p>This is a friendly reminder that your consultation starts in <strong>{{reminderLabel}}</strong>.</p>
<div class="info-card">
  <p><span class="info-label">With:</span> {{counterpartyName}}</p>
  <p><span class="info-label">Date &amp; time:</span> {{scheduledAt}}</p>
  <p><span class="info-label">Duration:</span> {{durationMinutes}} minutes</p>
  <p><span class="info-label">Type:</span> {{consultationType}}</p>
</div>
<div class="cta-wrap">
  <a class="cta" href="{{sessionUrl}}">Join Session</a>
</div>
