<h2>Case assignment</h2>
<p>Hi{{recipientName}},</p>
<p>{{actorName}} assigned you to <strong>{{caseName}}</strong>{{roleLabelBlock}}.</p>
<div class="info-card">
  <p><span class="info-label">Case:</span> {{caseName}}</p>
  <p><span class="info-label">Status:</span> {{statusLabel}}</p>
  <p><span class="info-label">Priority:</span> {{priorityLabel}}</p>
</div>
<div class="cta-wrap">
  <a class="cta" href="{{caseUrl}}">Open case</a>
</div>
