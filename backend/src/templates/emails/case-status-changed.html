<h2>Case status updated</h2>
<p>Hi{{recipientName}},</p>
<p><strong>{{caseName}}</strong> is now <strong>{{statusLabel}}</strong>{{actorBlock}}.</p>
<div class="info-card">
  <p><span class="info-label">Previous status:</span> {{previousStatusLabel}}</p>
  <p><span class="info-label">New status:</span> {{statusLabel}}</p>
  <p><span class="info-label">Priority:</span> {{priorityLabel}}</p>
</div>
<div class="cta-wrap">
  <a class="cta" href="{{caseUrl}}">Open case</a>
</div>
