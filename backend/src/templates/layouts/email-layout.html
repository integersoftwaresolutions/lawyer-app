<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{{headline}}</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f4f7f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    .preheader { display: none !important; visibility: hidden; opacity: 0; color: transparent; height: 0; width: 0; max-height: 0; max-width: 0; overflow: hidden; mso-hide: all; }
    .wrapper { width: 100%; background-color: #f4f7f7; padding: 40px 16px; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 24px rgba(8, 84, 86, 0.08); }
    .header { background: linear-gradient(135deg, {{brandColor}} 0%, {{brandColorLight}} 100%); padding: 32px 40px; text-align: center; }
    .header h1 { margin: 0; color: #ffffff; font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
    .header p { margin: 8px 0 0; color: rgba(255,255,255,0.85); font-size: 14px; }
    .body { padding: 40px; color: #1a2e2e; font-size: 16px; line-height: 1.65; }
    .body h2 { margin: 0 0 16px; font-size: 20px; font-weight: 600; color: #0d3d3f; }
    .body p { margin: 0 0 16px; color: #3d5252; }
    .otp-box { background: #f0fafa; border: 2px dashed {{brandColor}}; border-radius: 10px; padding: 24px; text-align: center; margin: 24px 0; }
    .otp-code { font-size: 36px; font-weight: 700; letter-spacing: 8px; color: {{brandColor}}; font-family: 'Courier New', monospace; }
    .info-card { background: #f8fbfb; border-left: 4px solid {{brandColor}}; border-radius: 0 8px 8px 0; padding: 16px 20px; margin: 20px 0; }
    .info-card p { margin: 4px 0; font-size: 14px; }
    .info-label { font-weight: 600; color: #0d3d3f; }
    .cta-wrap { text-align: center; margin: 28px 0 8px; }
    .cta { display: inline-block; background: {{brandColor}}; color: #ffffff !important; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-weight: 600; font-size: 15px; }
    .muted { font-size: 13px; color: #7a9191; }
    .footer { background: #f8fbfb; padding: 24px 40px; text-align: center; border-top: 1px solid #e8efef; }
    .footer p { margin: 4px 0; font-size: 12px; color: #8a9e9e; }
    .footer a { color: {{brandColor}}; text-decoration: none; }
  </style>
</head>
<body>
  <span class="preheader">{{preheader}}</span>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <h1>{{appName}}</h1>
        <p>Legal consultation, simplified</p>
      </div>
      <div class="body">
        {{content}}
      </div>
      <div class="footer">
        <p>&copy; {{year}} {{appName}}. All rights reserved.</p>
        <p>Need help? <a href="mailto:{{supportEmail}}">{{supportEmail}}</a></p>
        <p><a href="{{appBaseUrl}}">Visit {{appName}}</a></p>
      </div>
    </div>
  </div>
</body>
</html>
