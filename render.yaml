# Render Blueprint — Lawyer Marketplace
# https://render.com/docs/blueprint-spec
#
# Deploy: Dashboard → New → Blueprint → connect this repo
# Or create the two services manually (see DEPLOYMENT.md).

services:
  # ── API (Express + Socket.IO + jobs) ─────────────────────────────────────
  - type: web
    name: lawyer-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: beth.t@example.com
      - key: EMAIL_FROM_NAME
        value: Adal AI
      - key: LEADS_INBOX
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_FIRM_MONTHLY
        sync: false

  # ── SPA (Vite static) ────────────────────────────────────────────────────
  - type: web
    name: lawyer-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    envVars:
      - key: VITE_API_BASE
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
